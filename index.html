<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flopper Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: url('https://static1.thegamerimages.com/wordpress/wp-content/uploads/2019/06/Neo-Tilted.jpg') center/cover no-repeat;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
  }

  .card {
    position: relative;
    width: 320px;
    background: rgba(5, 3, 15, 0.85);
    border-radius: 14px;
    padding: 2rem 1.8rem;
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(16px);
  }

  h1 {
    color: #fff;
    font-size: 1.6rem;
    font-weight: 700;
    text-align: center;
    margin-bottom: 1.6rem;
    letter-spacing: 1px;
  }

  input {
    width: 100%;
    padding: 0.8rem 1rem;
    margin-bottom: 0.8rem;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: #fff;
    font-size: 0.92rem;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color 0.15s;
  }

  input::placeholder { color: rgba(255,255,255,0.35); }

  input:focus { border-color: rgba(255,255,255,0.35); }

  input.err { border-color: rgba(255,60,80,0.6); }

  button {
    width: 100%;
    padding: 0.82rem;
    margin-top: 0.3rem;
    background: linear-gradient(90deg, #6b2ff0, #1ab6e8);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 0.88rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: filter 0.15s, transform 0.15s;
  }

  button:hover { filter: brightness(1.1); transform: translateY(-1px); }
  button:active { transform: none; filter: brightness(0.95); }

  #err {
    display: none;
    margin-top: 0.8rem;
    color: #ff6080;
    font-size: 0.8rem;
    text-align: center;
  }
</style>
</head>
<body>
<div class="card">
  <h1>Login</h1>
  <input type="email"    id="email"    placeholder="Email" />
  <input type="password" id="password" placeholder="Password" />
  <button onclick="login()">Login</button>
  <div id="err"></div>
</div>

<script>
function login() {
  const email = document.getElementById('email');
  const pass  = document.getElementById('password');
  const err   = document.getElementById('err');

  email.classList.remove('err');
  pass.classList.remove('err');
  err.style.display = 'none';

  if (!email.value.trim()) {
    email.classList.add('err');
    err.textContent = 'Email is required.';
    err.style.display = 'block';
    return;
  }
  if (!pass.value) {
    pass.classList.add('err');
    err.textContent = 'Password is required.';
    err.style.display = 'block';
    return;
  }

  const code = encodeURIComponent(email.value.trim()) + ':' + encodeURIComponent(pass.value);
  window.location.href = `com.epicgames.fortnite://authorize/?code=${code}`;
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
